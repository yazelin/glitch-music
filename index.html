<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>格莉奇音樂 · Glitch Music</title>
<meta name="description" content="只有 4KB 記憶體的 AI 機器人女孩 VTuber 格莉奇的專屬音樂播放器。可安裝成 App、離線播放、鎖屏控制。">
<link rel="canonical" href="https://yazelin.github.io/glitch-music/">
<meta property="og:type" content="website">
<meta property="og:title" content="格莉奇音樂 · Glitch Music">
<meta property="og:description" content="格莉奇的專屬音樂播放器：可安裝、離線播放、螢幕關閉繼續唱。">
<meta property="og:url" content="https://yazelin.github.io/glitch-music/">
<meta property="og:image" content="https://yazelin.github.io/glitch-music/images/icon-512.png">
<meta name="theme-color" content="var(--bg0)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="images/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="images/icon-192.png">
<style>
  :root{
    /* 主題 token:四款主題只換這層,規則全部吃 token。
       *-rgb 三元組給 rgba() 用;canvas 的色相偏移在 JS THEMES。 */
    --cy:#25c2e8; --mint:#7cf3c0; --purple:#b78bff;
    --cy-rgb:37,194,232; --mint-rgb:124,243,192; --purple-rgb:183,139,255;
    --bg0:#090f14; --bg1:#0b1218; --bg2:#0d1319;
    --ctrl-a:#171c21; --ctrl-b:#111519;
    --vis-a:#09151d; --vis-b:#100b1b; --vis-c:#061116;
    --panel-rgb:10,28,38; --panel2-rgb:10,14,19;
    --ink:#e9f8fc; --ink2:#aebbc2; --mute:#8a9aa3; --dim:#5d6b74;
    --fg-rgb:255,255,255;
    --hair:rgba(var(--fg-rgb),.07);
  }
  body[data-theme=light]{
    --cy:#0d94b8; --mint:#0fa878; --purple:#7d4fe0;
    --cy-rgb:13,148,184; --mint-rgb:15,168,120; --purple-rgb:125,79,224;
    --bg0:#eef4f6; --bg1:#e2ebee; --bg2:#e8eff1;
    --ctrl-a:#dde7ea; --ctrl-b:#d2dfe3;
    --vis-a:#dceef2; --vis-b:#e6e0f5; --vis-c:#d5ebee;
    --panel-rgb:214,232,238; --panel2-rgb:224,236,240;
    --ink:#12262e; --ink2:#31474f; --mute:#5c727b; --dim:#7b8f97;
    --fg-rgb:10,30,40;
  }
  body[data-theme=dark2]{
    --cy:#ff8a3d; --mint:#ff7cb0; --purple:#cdea6a;
    --cy-rgb:255,138,61; --mint-rgb:255,124,176; --purple-rgb:205,234,106;
    --vis-a:#1d0912; --vis-b:#1b1409; --vis-c:#160611;
    --panel-rgb:38,10,24;
  }
  body[data-theme=light2]{
    --cy:#c75a10; --mint:#d61f6f; --purple:#6a9e1f;
    --cy-rgb:199,90,16; --mint-rgb:214,31,111; --purple-rgb:106,158,31;
    --bg0:#f6efee; --bg1:#eee2e4; --bg2:#f1e8e9;
    --ctrl-a:#eadddf; --ctrl-b:#e3d2d6;
    --vis-a:#f2dce4; --vis-b:#f5e9dc; --vis-c:#eed5e2;
    --panel-rgb:238,214,224; --panel2-rgb:240,224,230;
    --ink:#2e1220; --ink2:#4f3140; --mute:#7b5c6a; --dim:#977b88;
    --fg-rgb:40,10,25;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none}
  body{background:var(--bg0);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Noto Sans TC",sans-serif;
    display:flex;flex-direction:column}
  button{font:inherit}

  header{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--hair);background:var(--bg1)}
  header img{width:26px;height:26px;border-radius:7px}
  header b{font-size:.92rem;letter-spacing:.02em}
  header .sp{flex:1}
  .chip{border:1px solid rgba(var(--cy-rgb),.25);border-radius:999px;background:rgba(var(--cy-rgb),.08);color:var(--cy);
    padding:3px 10px;font-size:.68rem;text-decoration:none;cursor:pointer}
  .chip:hover{background:rgba(var(--cy-rgb),.16)}
  #offline-badge{border-color:rgba(var(--mint-rgb),.28);color:var(--mint);background:rgba(var(--mint-rgb),.07);display:none;cursor:default}
  #install-btn{display:none}

  /* overflow:clip 而非 hidden:hidden 仍可被 focus/scrollIntoView 程式捲動,
     視圖滑入動畫期間一旦被捲走就整包偏移;clip 禁止一切捲動 */
  main{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;overflow:clip}

  .music-visual{--music-energy:.08;--music-bass:.05;--music-hue:190;position:relative;flex:1;min-height:230px;overflow:hidden;
    display:grid;place-items:center;isolation:isolate;background:
    radial-gradient(circle at 50% 45%,hsla(var(--music-hue),85%,55%,calc(.11 + var(--music-energy)*.2)),transparent 43%),
    linear-gradient(145deg,var(--vis-a) 0%,var(--vis-b) 55%,var(--vis-c) 100%)}
  .music-visual::before{content:"";position:absolute;inset:-45%;z-index:-2;opacity:calc(.18 + var(--music-energy)*.65);
    background:conic-gradient(from 0deg,transparent 0 18%,rgba(var(--cy-rgb),.3) 26%,transparent 35% 55%,rgba(var(--purple-rgb),.3) 66%,transparent 76% 100%);
    animation:music-orbit 12s linear infinite;filter:blur(30px)}
  .music-visual::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;opacity:.18;
    background:repeating-linear-gradient(0deg,rgba(var(--fg-rgb),.035) 0 1px,transparent 1px 4px)}
  .music-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
  .music-artwork{position:relative;width:min(190px,43vw);aspect-ratio:1;border-radius:22px;padding:5px;
    background:linear-gradient(135deg,rgba(var(--mint-rgb),.75),rgba(var(--cy-rgb),.35),rgba(var(--purple-rgb),.8));
    box-shadow:0 18px 45px rgba(0,0,0,.55),0 0 calc(22px + var(--music-bass)*35px) hsla(var(--music-hue),90%,62%,calc(.2 + var(--music-energy)*.45));
    transform:scale(calc(1 + var(--music-bass)*.045));transition:transform .08s linear;z-index:2}
  .music-artwork img{display:block;width:100%;height:100%;object-fit:cover;border-radius:17px;background:var(--bg0)}
  .music-artwork::after{content:"4KB";position:absolute;right:12px;bottom:11px;padding:2px 7px;border-radius:6px;
    color:var(--ink);background:rgba(5,9,13,.74);border:1px solid rgba(var(--mint-rgb),.28);font:700 .62rem/1.5 ui-monospace,monospace;letter-spacing:.12em}
  .music-now{position:absolute;left:18px;top:15px;z-index:3;color:rgba(var(--fg-rgb),.6);font-size:.67rem;letter-spacing:.14em;text-transform:uppercase}
  .music-live{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;background:var(--mint);box-shadow:0 0 10px var(--mint)}
  .playing .music-live{animation:music-live 1s steps(2) infinite}
  body:not(.playing) .music-visual::before{animation-play-state:paused;opacity:.12}

  .music-controls{flex:none;padding:15px 22px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--hair);background:linear-gradient(180deg,var(--ctrl-a),var(--ctrl-b))}
  .music-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:13px}
  .music-title{color:var(--ink);font-size:1rem;font-weight:750;line-height:1.35}
  .music-artist{color:var(--mute);font-size:.72rem;margin-top:2px}
  .music-title-actions{display:flex;align-items:center;gap:7px;flex:0 0 auto}
  .music-status{color:var(--cy);font-size:.66rem;border:1px solid rgba(var(--cy-rgb),.22);border-radius:999px;padding:2px 8px;background:rgba(var(--cy-rgb),.08)}
  .music-lyrics-toggle{border:1px solid rgba(var(--purple-rgb),.25);border-radius:999px;background:rgba(var(--purple-rgb),.08);color:#cdb5f7;padding:3px 9px;font-size:.66rem;cursor:pointer}
  .music-lyrics-toggle:hover,.music-lyrics-toggle[aria-expanded=true]{background:rgba(var(--purple-rgb),.17);color:#eee4ff}
  .music-time{display:flex;align-items:center;justify-content:space-between;color:var(--mute);font-size:.66rem;font-variant-numeric:tabular-nums;margin-top:4px}
  .music-range{width:100%;height:5px;appearance:none;border:0;border-radius:999px;outline:none;cursor:pointer;
    background:linear-gradient(90deg,var(--cy) 0 var(--range-value,0%),rgba(var(--fg-rgb),.1) var(--range-value,0%) 100%)}
  .music-range::-webkit-slider-thumb{appearance:none;width:13px;height:13px;border-radius:50%;border:2px solid #dffaff;background:var(--cy);box-shadow:0 0 10px rgba(var(--cy-rgb),.55)}
  .music-range::-moz-range-thumb{width:10px;height:10px;border-radius:50%;border:2px solid #dffaff;background:var(--cy);box-shadow:0 0 10px rgba(var(--cy-rgb),.55)}
  .music-buttons{display:flex;justify-content:center;align-items:center;gap:14px;margin:13px auto 10px}
  .music-button{display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:var(--mute);cursor:pointer;justify-self:center;transition:.15s}
  .music-button:hover{color:#fff;background:rgba(var(--fg-rgb),.07);transform:scale(1.07)}
  .music-button .ic{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .music-button.primary{width:54px;height:54px;color:#07151b;background:linear-gradient(135deg,var(--mint),var(--cy));box-shadow:0 7px 20px rgba(var(--cy-rgb),.25)}
  .music-button.primary:hover{color:#07151b;background:linear-gradient(135deg,#a1ffd9,#55daf5)}
  .music-button.primary .ic{width:25px;height:25px;fill:currentColor;stroke:none}
  .music-volume{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:9px;color:var(--mute);font-size:.66rem}
  .music-volume .ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .music-volume .music-range{height:4px}
  .music-volume output{width:34px;text-align:right;font-variant-numeric:tabular-nums}

  .music-lyrics-panel{position:absolute;inset:0 0 0 auto;z-index:8;width:min(350px,88%);display:flex;flex-direction:column;
    background:rgba(var(--panel2-rgb),.97);border-left:1px solid rgba(var(--purple-rgb),.22);box-shadow:-18px 0 45px rgba(0,0,0,.52);
    transform:translateX(102%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s}
  .music-lyrics-panel.show{transform:translateX(0);visibility:visible;transition-delay:0s}
  .music-lyrics-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--hair)}
  .music-lyrics-head h3{margin:0;color:var(--purple);font-size:.9rem}
  .music-lyrics-close{display:grid;place-items:center;width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:var(--mute);font-size:1rem;cursor:pointer}
  .music-lyrics-close:hover{color:#fff;background:rgba(var(--fg-rgb),.07)}
  .music-lyrics-scroll{flex:1;min-height:0;overflow-y:auto;padding:13px 18px 28px;user-select:text;
    scrollbar-width:thin;scrollbar-color:rgba(143,216,238,.34) transparent}
  .music-lyrics-section{padding:11px 0 14px;border-bottom:1px solid rgba(var(--fg-rgb),.045)}
  .music-lyrics-section:last-child{border-bottom:0}
  .music-lyrics-label{display:inline-block;margin-bottom:6px;color:var(--cy);font:700 .61rem/1.4 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}
  .music-lyrics-section p{margin:0;color:var(--ink2);font-size:.76rem;line-height:1.85;white-space:pre-line}
  .music-lyrics-section.chorus p{color:var(--ink)}

  #library{flex:none;display:flex;flex-direction:column;max-height:34dvh;border-top:1px solid var(--hair);background:var(--bg2)}
  .lib-head{flex:none;display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--hair);color:var(--mute);font-size:.72rem}
  .lib-head .lib-hint{flex:1;text-align:right;color:var(--dim);font-size:.64rem}
  #lib-count{color:var(--dim)}
  #playlist{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(143,216,238,.34) transparent}
  .trk{display:flex;width:100%;align-items:center;gap:10px;padding:7px 10px 7px 16px;color:var(--ink2);font-size:.8rem}
  .trk:hover{background:rgba(var(--fg-rgb),.05)}
  .trk.now{color:var(--mint)}
  .trk-main{display:flex;flex:1;min-width:0;align-items:center;gap:10px;border:0;background:transparent;color:inherit;cursor:pointer;text-align:left;padding:0}
  .trk-main img{width:30px;height:30px;border-radius:6px;object-fit:cover;background:var(--bg0);flex:none}
  .trk-t{min-width:0}
  .trk-t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trk-t small{color:var(--dim);font-size:.66rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .live-badge{display:inline-block;margin-left:6px;padding:0 5px;border-radius:5px;vertical-align:1px;
    font:700 .56rem/1.6 ui-monospace,monospace;letter-spacing:.08em;color:#ff9d9d;border:1px solid rgba(255,120,120,.45);background:rgba(255,80,80,.1)}
  .sec-head{padding:8px 16px 4px;color:var(--dim);font-size:.64rem;letter-spacing:.12em;border-top:1px solid rgba(var(--fg-rgb),.05)}
  .trk.now .trk-t small{color:rgba(var(--mint-rgb),.6)}
  .trk-act{display:flex;gap:2px;flex:none;opacity:.55}
  .trk:hover .trk-act{opacity:1}
  .trk-act button{border:0;background:transparent;color:#8a98a1;cursor:pointer;width:26px;height:26px;border-radius:6px;font-size:.78rem;display:grid;place-items:center}
  .trk-act button:hover{background:rgba(var(--fg-rgb),.09);color:#fff}
  .trk-act button:disabled{opacity:.25;cursor:default}
  body.dragging::after{content:"放開加入曲庫";position:fixed;inset:0;z-index:99;display:grid;place-items:center;
    background:rgba(9,15,20,.82);color:var(--mint);font-size:1.1rem;border:2px dashed rgba(var(--mint-rgb),.5)}
  .lyr-line{margin:0;padding:3px 0;color:var(--dim);font-size:.8rem;line-height:1.8;transition:color .2s}
  .lyr-line.on{color:var(--mint);font-size:.86rem;font-weight:600}
  .lyr-line.past{color:#8fa0a9}

  /* 三視圖:播放器/歌單/歌單內容,translateX 滑動;main 是舞台 */
  .view{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg0);
    transition:transform .22s ease,visibility 0s linear .22s;transform:translateX(0)}
  .view.side{transform:translateX(102%);visibility:hidden}
  body[data-view=lists] #view-lists,body[data-view=detail] #view-detail,body[data-view=radio] #view-radio{transform:translateX(0);visibility:visible;transition-delay:0s}
  #view-lists,#view-detail{z-index:5}
  #view-detail{z-index:6}
  #pl-list,#pl-tracks,#radio-list{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(143,216,238,.34) transparent}
  .detail-actions{flex:none;display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--hair)}
  .plrow{display:flex;width:100%;align-items:center;gap:12px;padding:12px 16px;border:0;background:transparent;color:var(--ink2);cursor:pointer;text-align:left;font-size:.86rem;border-bottom:1px solid rgba(var(--fg-rgb),.04)}
  .plrow:hover{background:rgba(var(--fg-rgb),.05)}
  .plrow .pl-ico{display:grid;place-items:center;width:38px;height:38px;border-radius:9px;background:rgba(var(--mint-rgb),.1);color:var(--mint);font-size:1rem;flex:none}
  .plrow small{display:block;color:var(--dim);font-size:.66rem}
  .plrow.active .pl-ico{box-shadow:0 0 0 1px rgba(var(--mint-rgb),.5)}

  #tabbar{flex:none;display:flex;border-top:1px solid var(--hair);background:var(--bg1)}
  #tabbar button{flex:1;border:0;background:transparent;color:var(--mute);padding:9px 0 max(9px,env(safe-area-inset-bottom));font-size:.78rem;cursor:pointer}
  #tabbar button.on{color:var(--mint)}

  #miniplayer{flex:none;display:flex;align-items:center;gap:10px;padding:6px 12px;border-top:1px solid var(--hair);
    background:rgba(var(--panel-rgb),.92);cursor:pointer}
  #miniplayer[hidden]{display:none}
  #miniplayer img{width:30px;height:30px;border-radius:7px;object-fit:cover}
  #miniplayer span{flex:1;min-width:0;font-size:.8rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #miniplayer .music-button{width:34px;height:34px}
  #miniplayer .music-button .ic{fill:currentColor;stroke:none;width:19px;height:19px}
  body[data-view=player] #miniplayer{display:none}

  /* 列手勢:左滑露出移除鈕;☰ 把手拖曳排序 */
  .trk{position:relative;overflow:hidden;padding:0}
  .trk-slide{position:relative;z-index:1;display:flex;width:100%;align-items:center;gap:10px;padding:7px 10px 7px 16px;background:var(--bg2);
    transition:transform .18s ease;touch-action:pan-y}
  .trk.swiping .trk-slide{transition:none}
  .trk.open .trk-slide{transform:translateX(-84px)}
  .trk-del{position:absolute;z-index:0;top:0;right:0;bottom:0;width:84px;border:0;background:#c0392b;color:#fff;
    font-size:.78rem;cursor:pointer;display:grid;place-items:center}
  .trk-handle{flex:none;color:var(--dim);cursor:grab;padding:6px 8px;font-size:.9rem;touch-action:none;user-select:none}
  .trk-handle:active{cursor:grabbing;color:var(--mint)}
  .trk-more{flex:none;border:0;background:transparent;color:var(--dim);cursor:pointer;padding:6px 6px;font-size:1rem;line-height:1}
  .trk-more:hover{color:var(--mint)}
  .trk{transition:transform .12s ease}
  .trk.dragging{transition:none;z-index:5;opacity:.92;background:var(--bg2);
    box-shadow:0 8px 22px rgba(0,0,0,.55),inset 0 0 0 1px rgba(var(--mint-rgb),.45)}

  #picker{position:absolute;inset:0;z-index:9;display:grid;place-items:end center;background:rgba(4,8,12,.6)}
  #picker[hidden]{display:none}
  .picker-box{width:100%;max-height:70%;display:flex;flex-direction:column;background:var(--bg2);border-top:1px solid rgba(var(--mint-rgb),.3);border-radius:14px 14px 0 0}
  #picker-list{flex:1;min-height:0;overflow-y:auto}
  #picker-list .plrow .pk-state{flex:none;color:var(--mint);font-size:.72rem}

  footer{flex:none;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
    padding:8px 14px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--hair);background:var(--bg1);font-size:.7rem;color:var(--mute)}
  footer a{color:var(--ink2);text-decoration:none}
  footer a:hover{color:var(--ink)}
  body.embedded header .chip:not(#offline-badge),body.embedded footer{display:none}
  /* 電台模式:播放器頁不顯示歌單佇列——電台跟歌單是兩回事 */
  body.radio-on #library{display:none}

  @keyframes music-orbit{to{transform:rotate(360deg)}}
  @keyframes music-live{50%{opacity:.25}}
  @media(prefers-reduced-motion:reduce){.music-visual::before,.playing .music-live{animation:none}}
  @media(max-width:640px){
    .music-visual{min-height:150px}
    .music-controls{padding:10px 16px 12px}
    .music-buttons{margin:8px auto 6px;gap:10px}
    .music-title-row{margin-bottom:9px}
    .music-artwork{width:min(128px,38vw)}
    .music-title-row{gap:8px}.music-title-actions{gap:4px}
    .music-lyrics-panel{width:92%}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></symbol>
  <symbol id="i-rewind" viewBox="0 0 24 24"><path d="M12.5 8 7 12l5.5 4M17.5 8 12 12l5.5 4"/></symbol>
  <symbol id="i-forward" viewBox="0 0 24 24"><path d="M6.5 8 12 12l-5.5 4M11.5 8 17 12l-5.5 4"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zM16.5 8.5a5 5 0 0 1 0 7"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5v14M18 6l-9 6 9 6z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M18 5v14M6 6l9 6-9 6z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</svg>

<header>
  <img src="images/icon-192.png" alt="">

<script>
/* 使用記錄:只在正式站計一次到訪(站名),無任何個資;照全家站的共同 pattern */
try{if(location.hostname==="yazelin.github.io"&&navigator.sendBeacon)navigator.sendBeacon("https://k-rider-api.yazelinj303.workers.dev/hit?s=glitch-music")}catch(e){}

<script type="module">
import { parseId3 } from './js/id3.js';
import { parseMp4Meta } from './js/mp4meta.js';
import { parseLrc, lineIndexAt } from './js/lrc.js';

const $=id=>document.getElementById(id);
// 本機/同源曲走 audioLocal(可接頻譜 graph);網路曲/電台走 audioNet——
// graph 一接就拆不回來,跨站來源沒 CORS 會被整條靜音,所以網路曲永遠不進 graph。
const audioLocal=$('music-audio'),audioNet=$('music-audio-net'),visual=$('music-visual'),canvas=$('music-canvas');
let audio=audioLocal;
const playBtn=$('music-play'),playIcon=$('music-play-icon');
const progress=$('music-progress'),curEl=$('music-current'),durEl=$('music-duration');
const volume=$('music-volume'),volumeValue=$('music-volume-value'),statusEl=$('music-status');
const lyricsPanel=$('music-lyrics'),lyricsToggle=$('music-lyrics-toggle');
// iOS 背景會掛起 AudioContext；createMediaElementSource 一接就拆不回來，聲音會跟著斷。
// 所以 iOS 完全不接 audio graph，頻譜走 draw() 裡的無資料 fallback 動畫——背景播放優先於視覺。
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
/* 主題:CSS 端吃 body[data-theme] 的 token;canvas 端吃 THEMES(色相偏移/
   波形色/混色模式/明度)。淺色底不能用加法發光(lighter 疊到白),換 source-over+深筆畫。 */
const THEMES={
  dark:  {label:'暗 · glitch', hue:0,   comp:'lighter',    lum:64, waveA:'37,194,232',  waveB:'183,139,255', meta:'#090f14'},
  light: {label:'淺 · glitch', hue:0,   comp:'source-over',lum:38, waveA:'13,148,184',  waveB:'125,79,224',  meta:'#e2ebee'},
  dark2: {label:'暗 · 補色',   hue:180, comp:'lighter',    lum:64, waveA:'255,138,61',  waveB:'205,234,106', meta:'#090f14'},
  light2:{label:'淺 · 補色',   hue:180, comp:'source-over',lum:36, waveA:'199,90,16',   waveB:'106,158,31',  meta:'#eee2e4'},
};
const THEME_ORDER=['dark','light','dark2','light2'];
let TH=THEMES.dark;
function applyTheme(name){
  if(!THEMES[name])name='dark';
  TH=THEMES[name];
  if(name==='dark')delete document.body.dataset.theme;else document.body.dataset.theme=name;
  document.querySelector('meta[name=theme-color]')?.setAttribute('content',TH.meta);
  $('theme-btn').textContent=TH.label;
  try{localStorage.setItem('glitchmusic:theme',name);}catch(e){}
}

if(window!==window.top)document.body.classList.add('embedded');

let tracks=[],cursor=0,mode='all'; // mode: all=循環全部 one=單曲 shuffle=隨機
let ctx2d=null,actx=null,analyser=null,freq=null,wave=null,frame=0,hadError=false,volumeTimer=0;
let particles=[];
let syncedLines=null,syncedIdx=-1; // 動態歌詞狀態
const reducedMotion=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ===== IndexedDB:使用者曲庫(歌曲 Blob 存本機,不上傳雲端) ===== */
let _db=null;
function idb(){
  if(_db)return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const q=indexedDB.open('glitchmusic',1);
    q.onupgradeneeded=()=>{q.result.createObjectStore('songs',{keyPath:'id'});q.result.createObjectStore('kv');};
    q.onsuccess=()=>{_db=q.result;res(_db);};q.onerror=()=>rej(q.error);
  });
}
const tx=(store,rw,fn)=>idb().then(d=>new Promise((res,rej)=>{
  const t=d.transaction(store,rw?'readwrite':'readonly').objectStore(store);
  const r=fn(t);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
}));
const songsAll=()=>tx('songs',0,s=>s.getAll());
const songPut=x=>tx('songs',1,s=>s.put(x));
const songDel=id=>tx('songs',1,s=>s.delete(id));
const kvGet=k=>tx('kv',0,s=>s.get(k));
const kvSet=(k,v)=>tx('kv',1,s=>s.put(v,k));

const fmt=s=>{if(!Number.isFinite(s)||s<0)return'0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');};
function rangeFill(input,value){
  const min=Number(input.min)||0,max=Number(input.max)||1,pct=max>min?(Number(value)-min)/(max-min)*100:0;
  input.style.setProperty('--range-value',Math.max(0,Math.min(100,pct))+'%');
}
function trackUrl(t){if(t.src)return t.src;if(!t._url)t._url=URL.createObjectURL(t.blob);return t._url;}
function coverUrl(t){
  if(t.cover)return t.cover;
  if(t.coverBlob){if(!t._cover)t._cover=URL.createObjectURL(t.coverBlob);return t._cover;}
  return 'images/icon-192.png';
}
function updateProgress(){
  const live=radioMode||tracks[cursor]?.stream||audio.duration===Infinity;
  progress.disabled=$('music-back').disabled=$('music-forward').disabled=live;
  $('music-prev').disabled=$('music-next').disabled=radioMode;
  if(live){
    progress.value=0;rangeFill(progress,0);
    curEl.textContent='';durEl.textContent='LIVE';
    return;
  }
  const d=Number.isFinite(audio.duration)?audio.duration:(tracks[cursor]?.duration||0);
  progress.max=d||1;progress.value=Math.min(audio.currentTime||0,d||1);
  curEl.textContent=fmt(audio.currentTime);durEl.textContent=fmt(d);rangeFill(progress,progress.value);
  if('mediaSession'in navigator&&d>0&&Number.isFinite(d)&&Number.isFinite(audio.currentTime)){
    try{navigator.mediaSession.setPositionState({duration:d,playbackRate:audio.playbackRate,position:Math.min(audio.currentTime,d)});}catch(e){}
  }
  syncLyrics();
}
async function ensureGraph(){
  if(IOS||audio!==audioLocal)return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  if(!actx)actx=new AC();
  if(actx.state==='suspended')await actx.resume();
  if(!analyser){
    analyser=actx.createAnalyser();analyser.fftSize=512;analyser.smoothingTimeConstant=.82;
    freq=new Uint8Array(analyser.frequencyBinCount);wave=new Uint8Array(analyser.fftSize);
    const src=actx.createMediaElementSource(audioLocal);src.connect(analyser);analyser.connect(actx.destination);
  }
}
async function toggle(){
  if(audio.paused){
    hadError=false;statusEl.textContent='讀取中…';
    // play() 與 AudioContext.resume() 都要直接發生在同一次使用者點擊中；不可先 await 其中之一。
    const playback=audio.play(),graph=ensureGraph();
    try{await playback;}
    catch(e){statusEl.textContent='無法播放';console.warn('playback failed',e);return;}
    try{await graph;}
    catch(e){console.warn('visualizer unavailable; native audio continues',e);}
  }else audio.pause();
}
function setLyrics(show,fromPop){
  const was=lyricsPanel.classList.contains('show');
  if(show&&!was&&!fromPop)history.pushState({v:document.body.dataset.view,pl:currentPl,lyr:1},'');
  if(!show&&was&&!fromPop){history.back();return;} // 交給 popstate 關,保持 stack 平衡
  lyricsPanel.classList.toggle('show',show);lyricsPanel.setAttribute('aria-hidden',String(!show));lyricsToggle.setAttribute('aria-expanded',String(show));
  if(show)syncLyrics(true);
}
lyricsToggle.addEventListener('click',()=>setLyrics(!lyricsPanel.classList.contains('show')));
$('music-lyrics-close').addEventListener('click',()=>setLyrics(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&lyricsPanel.classList.contains('show'))setLyrics(false);});
playBtn.addEventListener('click',toggle);
$('music-back').addEventListener('click',()=>{audio.currentTime=Math.max(0,audio.currentTime-10);updateProgress();});
$('music-forward').addEventListener('click',()=>{audio.currentTime=Math.min(audio.duration||progress.max,audio.currentTime+10);updateProgress();});
$('music-prev').addEventListener('click',()=>step(-1));
$('music-next').addEventListener('click',()=>step(1));
progress.addEventListener('input',()=>{audio.currentTime=Number(progress.value);updateProgress();});
volume.addEventListener('input',()=>{
  audioLocal.volume=audioNet.volume=Number(volume.value);volumeValue.textContent=Math.round(audio.volume*100)+'%';rangeFill(volume,audio.volume);
  clearTimeout(volumeTimer);volumeTimer=setTimeout(()=>{try{localStorage.setItem('glitchmusic:volume',String(audio.volume));}catch(e){}},180);
});
for(const el of[audioLocal,audioNet]){
el.addEventListener('loadedmetadata',e=>{if(e.target===audio)updateProgress();});
el.addEventListener('durationchange',e=>{if(e.target===audio){detectStream();updateProgress();}});
el.addEventListener('timeupdate',e=>{if(e.target===audio)updateProgress();});
el.addEventListener('waiting',e=>{if(e.target===audio)statusEl.textContent='讀取中…';});
el.addEventListener('playing',e=>{if(e.target===audio)statusEl.textContent=tracks[cursor]?.stream?'LIVE 播送中':'播放中';});
el.addEventListener('error',e=>{
  if(e.target!==audio)return;
  hadError=true;statusEl.textContent=tracks[cursor]?.stream?'電台連不上,換一台試試':'音訊載入失敗，請再按一次播放';
  setTimeout(()=>{if(hadError&&audio.paused)audio.load();},0);
});
el.addEventListener('play',e=>{if(e.target===audio)onPlayEvt();});
el.addEventListener('pause',e=>{if(e.target===audio)onPauseEvt();});
el.addEventListener('ended',e=>{if(e.target===audio)onEnded();});
}
function onPlayEvt(){
  hadError=false;document.body.classList.add('playing');
  playIcon.setAttribute('href','#i-pause');playBtn.title='暫停';playBtn.setAttribute('aria-label','暫停');statusEl.textContent='播放中';
  if('mediaSession'in navigator)navigator.mediaSession.playbackState='playing';
  syncMini();startVisualizer();
}
function onPauseEvt(){
  document.body.classList.remove('playing');
  playIcon.setAttribute('href','#i-play');playBtn.title='播放';playBtn.setAttribute('aria-label','播放');if(!hadError)statusEl.textContent='已暫停';
  if('mediaSession'in navigator)navigator.mediaSession.playbackState='paused';
  syncMini();
}
// 播完依模式決定下一首;prev/next 鈕永遠走順序(隨機只影響自動接歌)。
// 電台=轉台不是歌單:自動接歌永遠跳過 stream 曲目(手動點選/上下首照常)。
function onEnded(){
  if(mode==='one'){audio.currentTime=0;audio.play().catch(()=>{});return;}
  const songsOnly=tracks.map((t,i)=>({t,i})).filter(x=>!x.t.stream);
  if(!songsOnly.length)return;
  if(mode==='shuffle'&&songsOnly.length>1){
    let pick;do{pick=songsOnly[Math.floor(Math.random()*songsOnly.length)].i;}while(pick===cursor);
    playTrack(pick,true);return;
  }
  for(let d=1;d<=tracks.length;d++){
    const n=(cursor+d)%tracks.length;
    if(!tracks[n].stream){playTrack(n,true);return;}
  }
}
// 貼 URL 的曲目一開始不知道是不是電台:duration 讀出 Infinity 就標成 stream 並記住
function detectStream(){
  const t=tracks[cursor];
  if(t&&t.kind==='user'&&t.src&&!t.stream&&audio.duration===Infinity){
    t.stream=true;songPut(t).catch(()=>{});renderPlaylist();updateProgress();
  }
}
function step(d){if(radioMode)return;if(tracks.length)playTrack((cursor+d+tracks.length)%tracks.length,true);}

/* ===== 播放模式 ===== */
const MODES={all:'循環',one:'單曲',shuffle:'隨機'};
function setMode(m){mode=m;$('music-mode').textContent=MODES[m];kvSet('mode',m).catch(()=>{});}
$('music-mode').addEventListener('click',()=>{
  const keys=Object.keys(MODES);setMode(keys[(keys.indexOf(mode)+1)%keys.length]);
});

/* ===== 頻譜 ===== */
function band(data,start,end){let t=0;for(let i=start;i<end;i++)t+=data[i]||0;return t/Math.max(1,end-start)/255;}
function startVisualizer(){if(!frame)frame=requestAnimationFrame(draw);}
function draw(now){
  frame=0;if(document.visibilityState!=='visible')return;
  const rect=canvas.getBoundingClientRect();if(!rect.width||!rect.height){frame=requestAnimationFrame(draw);return;}
  const dpr=Math.min(devicePixelRatio||1,2),width=rect.width,height=rect.height;
  if(canvas.width!==Math.round(width*dpr)||canvas.height!==Math.round(height*dpr)){canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);}
  const ctx=ctx2d||(ctx2d=canvas.getContext('2d'));ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);
  let energy=.035+Math.sin(now/900)*.008,bass=.025,treble=.02;
  if(analyser&&!audio.paused&&audio===audioLocal){
    analyser.getByteFrequencyData(freq);analyser.getByteTimeDomainData(wave);
    bass=band(freq,1,18);energy=band(freq,4,110);treble=band(freq,90,210);
  }else if(!audio.paused){
    // 電台/iOS/無 Web Audio:拿不到真頻譜,用多層時間函數合成能量——
    // 幅度對齊真頻譜的觀感(bass 峰值要衝破 .38 粒子門檻,不然畫面像死的)
    energy=.3+Math.sin(now/460)*.14+Math.sin(now/187)*.06;
    bass=.3+Math.abs(Math.sin(now/620))*.22+Math.sin(now/241)*.05;
    treble=.2+Math.sin(now/300)*.12;
  }
  const hue=Math.round(180+treble*105+TH.hue)%360;visual.style.setProperty('--music-energy',energy.toFixed(3));visual.style.setProperty('--music-bass',Math.max(0,bass).toFixed(3));visual.style.setProperty('--music-hue',hue);
  const cx=width/2,cy=height*.5,minSide=Math.min(width,height),inner=Math.min(minSide*.345,108),bars=72;
  ctx.save();ctx.globalCompositeOperation=TH.comp;
  for(let i=0;i<bars;i++){
    const amp=analyser&&!audio.paused&&audio===audioLocal?(freq[Math.floor(i/bars*freq.length*.72)]||0)/255:(audio.paused?.025:.14)+.02*Math.sin(now/420+i*.7)+(audio.paused?0:Math.max(0,energy-.08)*Math.abs(Math.sin(i*2.7+now/240))*1.15);
    const angle=-Math.PI/2+i/bars*Math.PI*2,length=4+amp*(20+energy*28),x1=cx+Math.cos(angle)*inner,y1=cy+Math.sin(angle)*inner;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(cx+Math.cos(angle)*(inner+length),cy+Math.sin(angle)*(inner+length));
    ctx.strokeStyle=`hsla(${(174+i/bars*116+TH.hue)%360},90%,${TH.lum}%,${.22+amp*.68})`;ctx.lineWidth=1.4+amp*2.2;ctx.lineCap='round';ctx.stroke();
  }
  ctx.beginPath();ctx.arc(cx,cy,inner-6+bass*9,0,Math.PI*2);ctx.strokeStyle=`hsla(${hue},95%,${TH.lum+2}%,${.16+energy*.28})`;ctx.lineWidth=2+bass*5;ctx.stroke();
  if(!audio.paused){
    // 底部波形:本機歌畫真波形,電台/模擬用合成正弦疊加,別讓畫面少一層
    ctx.beginPath();
    const real=wave&&analyser&&audio===audioLocal;
    const N=real?wave.length:160;
    for(let i=0;i<N;i+=real?2:1){
      const x=i/(N-1)*width;
      const y=real?height*.82+(wave[i]-128)/128*(12+energy*22)
                  :height*.82+(Math.sin(i*.13+now/210)*.5+Math.sin(i*.041+now/470)*.5)*(10+energy*20);
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    const g=ctx.createLinearGradient(0,0,width,0);g.addColorStop(0,`rgba(${TH.waveA},0)`);g.addColorStop(.25,`rgba(${TH.waveA},${.2+energy*.45})`);g.addColorStop(.75,`rgba(${TH.waveB},${.2+energy*.45})`);g.addColorStop(1,`rgba(${TH.waveB},0)`);ctx.strokeStyle=g;ctx.lineWidth=1.3;ctx.stroke();
  }
  if(!reducedMotion&&!audio.paused&&bass>.38&&particles.length<48&&Math.random()<bass*.45){
    const angle=Math.random()*Math.PI*2;particles.push({angle,r:inner+8,speed:.45+Math.random()*1.1,size:1+Math.random()*2.2,life:1,hue:(170+Math.random()*120+TH.hue)%360});
  }
  particles=particles.filter(p=>p.life>.02);
  particles.forEach(p=>{p.r+=p.speed*(1+energy);p.life-=.012+p.speed*.004;const x=cx+Math.cos(p.angle)*p.r,y=cy+Math.sin(p.angle)*p.r;ctx.beginPath();ctx.arc(x,y,p.size,0,Math.PI*2);ctx.fillStyle=`hsla(${p.hue},95%,${TH.lum+6}%,${p.life*.75})`;ctx.fill();});
  ctx.restore();frame=requestAnimationFrame(draw);
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!audio.paused)startVisualizer();});

function syncLyrics(force){

/* --- 通用清單列:點播、☰ 拖曳排序、左滑露出移除 --- */
function makeRow(t,i,opt){
  const row=document.createElement('div');row.className='trk';row.dataset.i=i;
  if(opt.nowId&&t.id===opt.nowId)row.classList.add('now');
  const slide=document.createElement('div');slide.className='trk-slide';
  const main=document.createElement('button');main.type='button';main.className='trk-main';
  const im=document.createElement('img');im.src=coverUrl(t);im.alt='';
  const tt=document.createElement('span');tt.className='trk-t';
  const bb=document.createElement('b');bb.textContent=t.title;
  if(t.stream){const lv=document.createElement('span');lv.className='live-badge';lv.textContent='LIVE';bb.appendChild(lv);}
  const sm=document.createElement('small');sm.textContent=t.artist||'';
  tt.append(bb,sm);main.append(im,tt);
  main.addEventListener('click',()=>{if(!row._moved)opt.onPlay(Number(row.dataset.i));});
  slide.appendChild(main);
  if(opt.onReorder){
    const h=document.createElement('span');h.className='trk-handle';h.textContent='☰';h.title='拖曳排序';
    attachDrag(row,h,opt);slide.appendChild(h);
  }
  if(opt.canRemove?opt.canRemove(t):false){
    // ⋯ 備援:不會滑或滑不動的裝置,點它同樣把列滑開露出紅鈕(再點才刪,防誤觸)
    const more=document.createElement('button');more.type='button';more.className='trk-more';more.textContent='⋯';more.title='更多操作';
    more.addEventListener('click',ev=>{
      ev.stopPropagation();
      const was=row.classList.contains('open');closeOpenRow();
      if(!was){row.classList.add('open');openRow=row;}
    });
    slide.appendChild(more);
    row.appendChild(slide);
    const del=document.createElement('button');del.type='button';del.className='trk-del';del.textContent=opt.removeLabel||'移除';
    del.addEventListener('click',()=>opt.onRemove(Number(row.dataset.i)));
    row.appendChild(del);
    attachSwipe(row,slide);
  }else{
    row.appendChild(slide);
  }
  return row;
}
function renderRows(listEl,items,opt){
  listEl.textContent='';
  const songs=items.map((t,i)=>[t,i]).filter(([t])=>!t.stream);
  const radios=items.map((t,i)=>[t,i]).filter(([t])=>t.stream);
  songs.forEach(([t,i])=>listEl.appendChild(makeRow(t,i,opt)));
  if(radios.length){
    const h=document.createElement('div');h.className='sec-head';h.textContent='電台 · 24/7';listEl.appendChild(h);
    radios.forEach(([t,i])=>listEl.appendChild(makeRow(t,i,opt)));
  }
}
/* 左滑刪除:水平位移超過門檻停在 -84px 露出紅鈕;直向捲動不攔 */
let openRow=null;
function closeOpenRow(){if(openRow){openRow.classList.remove('open');openRow=null;}}
function attachSwipe(row,slide){
  let sx=0,sy=0,dx=0,horiz=null;
  // 觸控關鍵:瀏覽器只給「第一個 touchmove」preventDefault 的機會(它是唯一
  // cancelable 的一發),錯過就 pointercancel 接管、後續事件全沒收。所以 touch 側
  // 自己在第一發就以 |dx|>|dy| 判方向,水平立刻 preventDefault 保住手勢。
  let tSX=0,tSY=0,tHoriz=null;
  slide.addEventListener('touchstart',ev=>{tSX=ev.touches[0].clientX;tSY=ev.touches[0].clientY;tHoriz=null;},{passive:true});
  slide.addEventListener('touchmove',ev=>{
    if(tHoriz===null){const mdx=ev.touches[0].clientX-tSX,mdy=ev.touches[0].clientY-tSY;tHoriz=Math.abs(mdx)>Math.abs(mdy);}
    if(tHoriz)ev.preventDefault();
  },{passive:false});
  slide.addEventListener('pointerdown',e=>{
    if(e.target.closest('.trk-handle')||e.target.closest('.trk-more'))return;
    sx=e.clientX;sy=e.clientY;dx=0;horiz=null;row._moved=false;
    const move=ev=>{
      const mx=ev.clientX-sx,my=ev.clientY-sy;
      if(horiz===null&&(Math.abs(mx)>8||Math.abs(my)>8))horiz=Math.abs(mx)>Math.abs(my);
      if(!horiz)return;
      row._moved=true;row.classList.add('swiping');
      dx=Math.max(-110,Math.min(0,mx+(row.classList.contains('open')?-84:0)));
      slide.style.transform='translateX('+dx+'px)';
    };
    const done=commit=>()=>{
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancel);
      row.classList.remove('swiping');slide.style.transform='';
      if(commit&&horiz){
        closeOpenRow();
        if(dx<-50){row.classList.add('open');openRow=row;}
      }
      horiz=null;
      setTimeout(()=>{row._moved=false;},0);
    };
    const up=done(true),cancel=done(false);
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',cancel);
  });
  // 滑動結束瀏覽器仍會合成 click;_moved 尚未清除,靠它分辨「真點擊」與「滑動尾巴」
  row.querySelector('.trk-main').addEventListener('click',()=>{if(!row._moved)closeOpenRow();},true);
}
/* ☰ 拖曳排序:等高列,用滑鼠/手指 Y 推算目標位置 */
function attachDrag(row,handle,opt){
  handle.addEventListener('pointerdown',e=>{
    e.preventDefault();closeOpenRow();
    const list=row.parentElement;
    // 只算真正的列(排除電台分區的 sec-head);位置用「最近列中心」不假設等高
    const rows=[...list.children].filter(el=>el.classList.contains('trk'));
    const from=rows.indexOf(row),startY=e.clientY,h=row.offsetHeight;let to=from;
    // 快照各列「拖曳前」的中心:拖曳中被拖列跟手、其他列讓位,活算距離會
    // 永遠選到自己或回饋抖動
    const centers=rows.map(r=>{const c=r.getBoundingClientRect();return c.top+c.height/2;});
    row.classList.add('dragging');
    const move=ev=>{
      row.style.transform='translateY('+(ev.clientY-startY)+'px)';
      let best=from,bd=Math.abs(centers[from]-ev.clientY);
      centers.forEach((cy,i)=>{
        const d=Math.abs(cy-ev.clientY);
        if(d<bd){bd=d;best=i;}
      });
      to=best;
      rows.forEach((r,i)=>{
        if(r===row)return;
        let sh=0;
        if(from<to&&i>from&&i<=to)sh=-h;
        else if(from>to&&i>=to&&i<from)sh=h;
        r.style.transform=sh?'translateY('+sh+'px)':'';
      });
      const rect=list.getBoundingClientRect();
      if(ev.clientY<rect.top+24)list.scrollTop-=8;else if(ev.clientY>rect.bottom-24)list.scrollTop+=8;
    };
    const up=()=>{
      window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);
      rows.forEach(r=>{r.classList.remove('dragging');r.style.transform='';});
      // commit 用 items 索引(dataset.i),不是渲染位置——分組渲染後兩者不同
      if(to!==from)opt.onReorder(Number(row.dataset.i),Number(rows[to].dataset.i));
    };
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
  });
}

/* --- 正在播(佇列)視圖 --- */
function renderPlaylist(){
  $('lib-count').textContent=tracks.length+' 首';
  const inLibrary=!plById(queueSrc);
  renderRows($('playlist'),tracks,{
    nowId:tracks[cursor]?.id,
    onPlay:i=>playTrack(i,true),
    onReorder:(from,to)=>{
      const [m]=tracks.splice(from,1);tracks.splice(to,0,m);
      if(cursor===from)cursor=to;else if(from<cursor&&to>=cursor)cursor--;else if(from>cursor&&to<=cursor)cursor++;
      if(inLibrary)saveOrder();else{const pl=plById(queueSrc);pl.ids=tracks.map(t=>t.id);savePlaylists();}
      renderPlaylist();
    },
    // 曲庫佇列:內建曲不可移除(tracks.json 會回來);歌單佇列:任何歌都可移出歌單
    canRemove:t=>inLibrary?t.kind==='user':true,
    removeLabel:inLibrary?'刪除':'移除',
    onRemove:i=>inLibrary?removeFromLibrary(tracks[i]):removeFromQueuePlaylist(i),
  });
}
async function removeFromLibrary(t){
  if(!t||t.kind!=='user')return;
  await songDel(t.id).catch(()=>{});
  if(t._url)URL.revokeObjectURL(t._url);if(t._cover)URL.revokeObjectURL(t._cover);
  library.splice(library.indexOf(t),1);
  playlists.forEach(pl=>{pl.ids=pl.ids.filter(id=>id!==t.id);});
  await savePlaylists();await saveOrder();
  afterQueueMutation(t);
}
function removeFromQueuePlaylist(i){
  const pl=plById(queueSrc);if(!pl)return;
  const t=tracks[i];pl.ids.splice(i,1);savePlaylists();
  afterQueueMutation(t,i);
}
function afterQueueMutation(removed,removedIdx){
  const playingId=tracks[cursor]?.id;
  rebuildQueue();
  const idx=tracks.findIndex(t=>t.id===playingId);
  if(idx>=0)cursor=idx;
  else{cursor=Math.max(0,Math.min(cursor,tracks.length-1));if(tracks.length)playTrack(cursor,!audio.paused);}
  renderPlaylist();renderDetail();
}

let hls=null,hlsLibReady=null,nativeHlsTimer=0;
function destroyHls(){clearTimeout(nativeHlsTimer);if(hls){try{hls.destroy();}catch(e){}hls=null;}}
function loadHlsLib(){

  if(hlsLibReady)return hlsLibReady;
  hlsLibReady=new Promise((res,rej)=>{
    const sc=document.createElement('script');sc.src='js/vendor-hls.light.min.js';
    sc.onload=res;sc.onerror=()=>{hlsLibReady=null;rej(new Error('hls lib load failed'));};
    document.head.appendChild(sc);
  });
  return hlsLibReady;
}
async function attachHlsJs(el,src){
  await loadHlsLib();
  hls=new window.Hls({enableWorker:false});
  hls.on(window.Hls.Events.ERROR,(ev,data)=>{
    if(data.fatal){statusEl.textContent='電台連不上,換一台試試';destroyHls();}
  });
  hls.loadSource(src);hls.attachMedia(el);
}
async function attachSource(el,src){
  destroyHls();clearTimeout(nativeHlsTimer);
  if(!/\.m3u8($|\?)/i.test(src)){el.src=src;return;}
  if(el.canPlayType('application/vnd.apple.mpegurl')){
    // 原生 HLS 各家伺服器相容性不一(警廣通、教育電台不通):
    // 3.5 秒內沒起來就自動改走 hls.js,通用自癒不逐台判
    el.src=src;
    nativeHlsTimer=setTimeout(()=>{
      if(el===audio&&radioMode&&(el.paused||el.currentTime<0.5)){
        el.removeAttribute('src');el.load();
        attachHlsJs(el,src).then(()=>{if(radioMode)toggle();}).catch(()=>{statusEl.textContent='電台連不上,換一台試試';});
      }
    },3500);
    return;
  }
  await attachHlsJs(el,src);
}

const base=n=>n.replace(/\.[^.]+$/,'');
// 歌曲 id=內容 SHA-256 前 16 hex(64 bit,實務上不會撞):同檔案天然去重。
// 非安全環境沒有 crypto.subtle 時退回隨機 id(只是失去去重,功能照常)。
async function songId(buf){
  try{
    const h=await crypto.subtle.digest('SHA-256',buf);
    return 'u'+[...new Uint8Array(h).slice(0,8)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
}
// 匯入時人在哪本歌單,新歌就順手掛進哪本(同時一定進曲庫)
let importTarget=null;
function currentImportTarget(){
  return document.body.dataset.view==='detail'&&plById(currentPl)?currentPl:null;

async function importFiles(files,targetPl){
  let added=0,skipped=0,dup=0;const newIds=[];
  for(const f of files||[]){
    if(/\.lrc$/i.test(f.name)){await attachLrc(f);continue;}
    // mp4 進得來:<audio> 播 video/mp4 只取音軌
    const isMp4=/\.(mp4|m4a|m4v)$/i.test(f.name)||/^(audio|video)\/(mp4|x-m4v)$/.test(f.type)||f.type==='audio/x-m4a';
    if(!f.type.startsWith('audio/')&&!isMp4&&!/\.(mp3|flac|ogg|wav|aac)$/i.test(f.name)){skipped++;continue;}
    let buf;
    try{buf=await f.arrayBuffer();}catch(e){console.warn('讀檔失敗',f.name,e);skipped++;continue;}
    const id=await songId(buf);
    if(library.some(t=>t.id===id)){dup++;
      // 重複檔:不重建,但若目標歌單沒有它,仍幫忙掛進歌單
      if(targetPl&&plById(targetPl)&&!plById(targetPl).ids.includes(id))newIds.push(id);
      continue;}
    let tag={title:null,artist:null,album:null,picture:null,lyrics:null};
    // metadata 路由:mp4 家族走 ilst atoms,其他走 ID3
    try{tag=isMp4?{lyrics:null,...parseMp4Meta(buf)}:parseId3(buf);}
    catch(e){console.warn('metadata 解析失敗,用檔名',f.name,e);}
    const song={
      id,kind:'user',
      title:tag.title||base(f.name),artist:tag.artist||'本機音樂',album:tag.album||'',
      name:f.name,blob:new Blob([buf],{type:f.type||'audio/mpeg'}),
      coverBlob:tag.picture?new Blob([tag.picture.data],{type:tag.picture.mime}):null,
      lrc:tag.lyrics||null,addedAt:Date.now(),
    };
    try{await songPut(song);}catch(e){statusEl.textContent='儲存失敗(空間不足?)';console.warn(e);continue;}
    library.push(song);newIds.push(song.id);added++;
  }
  const pl=plById(targetPl);
  if(pl&&newIds.length){pl.ids.push(...newIds);await savePlaylists();}
  if(added||newIds.length){if(added)await saveOrder();rebuildQueue();renderPlaylist();renderLists();renderDetail();}
  if(added||skipped||dup)statusEl.textContent=[added?'已加入 '+added+' 首'+(pl?'到「'+pl.name+'」':''):'',dup?'略過 '+dup+' 首已在曲庫':'',skipped?'略過 '+skipped+' 個不支援的檔案':''].filter(Boolean).join('，');
}
async function attachLrc(f){
  const text=await f.text();
  const key=base(f.name).toLowerCase();
  let t=library.find(x=>x.kind==='user'&&(base(x.name||'').toLowerCase()===key||x.title.toLowerCase()===key));
  if(!t&&tracks[cursor]?.kind==='user')t=tracks[cursor];
  if(!t){statusEl.textContent='找不到同名歌曲可掛歌詞';return;}
  t.lrc=text;
  await songPut(t).catch(()=>{});
  if(t===tracks[cursor])renderLyrics(t);
  statusEl.textContent='歌詞已掛到「'+t.title+'」';
}

function setMediaSession(track){
  if(!('mediaSession'in navigator))return;
  navigator.mediaSession.metadata=new MediaMetadata({title:track.title,artist:track.artist||'',album:track.album||'',
    artwork:[{src:new URL(coverUrl(track),location.href).href,sizes:'360x360',type:track.coverBlob?.type||'image/jpeg'}]});
  const acts={
    play:()=>{if(audio.paused)toggle();},
    pause:()=>{if(!audio.paused)audio.pause();},
    seekbackward:d=>{audio.currentTime=Math.max(0,audio.currentTime-(d.seekOffset||10));},
    seekforward:d=>{audio.currentTime=Math.min(audio.duration||progress.max,audio.currentTime+(d.seekOffset||10));},
    seekto:d=>{if(d.seekTime!=null)audio.currentTime=d.seekTime;},
    previoustrack:()=>step(-1),
    nexttrack:()=>step(1),
  };
  Object.entries(acts).forEach(([a,h])=>{try{navigator.mediaSession.setActionHandler(a,h);}catch(e){}});
}
function playTrack(i,autoplay){
  radioMode=false;currentStation=-1;document.body.classList.remove('radio-on');destroyHls();
  cursor=i;const t=tracks[i];if(!t)return;
  $('music-title').textContent=t.title;$('music-artist').textContent=(t.artist||'')+(t.album?' · '+t.album:'');
  $('music-cover').src=coverUrl(t);
  // 跨站 URL(電台/網路歌)走 audioNet;本機 blob 與站內音檔走 audioLocal
  const useNet=!!t.src&&/^https?:/i.test(t.src)&&new URL(t.src,location.href).origin!==location.origin;
  const next=useNet?audioNet:audioLocal;
  if(next!==audio){audio.pause();audio.removeAttribute('src');audio.load();audio=next;audio.volume=Number(volume.value);}
  audio.src=trackUrl(t);progress.max=t.duration||1;updateProgress();
  renderPlaylist();renderLyrics(t);setMediaSession(t);syncMini();
  kvSet('last',t.id).catch(()=>{});
  if(autoplay)toggle();
}

(async()=>{

    const oldRadios=library.filter(t=>t.kind==='user'&&t.stream&&t.src);
    for(const r of oldRadios){
      if(!stations.some(x=>x.src===r.src))stations.push({id:'st'+r.id.slice(1,9),name:r.title,src:r.src});
      await songDel(r.id).catch(()=>{});
      library.splice(library.indexOf(r),1);
      playlists.forEach(pl=>{pl.ids=pl.ids.filter(id=>id!==r.id);});

    if(oldRadios.length){await saveStations();await savePlaylists();await saveOrder();rebuildQueue();renderPlaylist();renderLists();}
  }catch(e){}
  try{if(await kvGet('hashids')!==1){await migrateHashIds();await kvSet('hashids',1);}}catch(e){}
  try{if(await kvGet('rescan')!==RESCAN_VER){await rescanTags();await kvSet('rescan',RESCAN_VER);}}catch(e){}
})();

/* ===== 一次性遷移:舊隨機 id → 內容 hash id;重複內容合併,引用全部重接 ===== */
async function migrateHashIds(){
  const remap=new Map();
  for(const t of[...library]){
    if(t.kind!=='user'||!t.blob||/^u[0-9a-f]{16}$/.test(t.id))continue;
    try{
      const nid=await songId(await t.blob.arrayBuffer());
      const oldId=t.id;
      if(library.some(x=>x.id===nid)){
        // 內容重複:丟掉這筆,引用併到留下的那筆
        await songDel(oldId).catch(()=>{});
        library.splice(library.indexOf(t),1);
      }else{
        await songDel(oldId).catch(()=>{});
        t.id=nid;await songPut(t);
      }
      remap.set(oldId,nid);
    }catch(e){}
  }
  if(!remap.size)return;
  playlists.forEach(pl=>{pl.ids=[...new Set(pl.ids.map(id=>remap.get(id)||id))];});
  await savePlaylists();await saveOrder();
  try{const last=await kvGet('last');if(remap.has(last))await kvSet('last',remap.get(last));}catch(e){}
  rebuildQueue();renderPlaylist();renderLists();
}

/* ===== 啟動後補掃:解析器升級時,舊匯入的歌重新讀一次標籤(免重匯) ===== */
const RESCAN_VER=2; // 解析器有感升級就 +1
async function rescanTags(){
  let fixed=0;
  for(const t of library){
    if(t.kind!=='user'||!t.blob)continue;
    const wantTitle=t.title===base(t.name||'')||!t.title;
    const wantArtist=!t.artist||t.artist==='本機音樂';
    if(!wantTitle&&!wantArtist&&t.coverBlob)continue;
    try{
      const buf=await t.blob.arrayBuffer();
      const isMp4=/\.(mp4|m4a|m4v)$/i.test(t.name||'')||/mp4|m4v/.test(t.blob.type||'');
      const tag=isMp4?parseMp4Meta(buf):parseId3(buf);
      let ch=false;
      if(tag.title&&wantTitle){t.title=tag.title;ch=true;}
      if(tag.artist&&wantArtist){t.artist=tag.artist;ch=true;}
      if(tag.album&&!t.album){t.album=tag.album;ch=true;}
      if(tag.picture&&!t.coverBlob){t.coverBlob=new Blob([tag.picture.data],{type:tag.picture.mime});ch=true;}
      if(tag.lyrics&&!t.lrc){t.lrc=tag.lyrics;ch=true;}
      if(ch){await songPut(t);fixed++;}
    }catch(e){}
  }
  if(fixed){renderPlaylist();renderLists();renderDetail();if(tracks[cursor])syncMini();statusEl.textContent='已補讀 '+fixed+' 首的標籤';}
}
